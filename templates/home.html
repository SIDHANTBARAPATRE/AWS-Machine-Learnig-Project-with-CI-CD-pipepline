<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exam Performance Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:      #F6F1E4;
    --paper-line: #E2D8BE;
    --ink:        #232A25;
    --pencil:     #8A8072;
    --pen-red:    #B23A2E;
    --pen-blue:   #2E4C6E;
    --card-shadow: 0 30px 60px -25px rgba(35,42,37,0.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 35px,
        var(--paper-line) 35px, var(--paper-line) 36px
      ),
      var(--paper);
    font-family:'Inter', sans-serif;
    color:var(--ink);
  }

  body{
    display:flex;
    justify-content:center;
    padding:64px 20px 80px;
  }

  .sheet{
    position:relative;
    width:100%;
    max-width:620px;
    background:var(--paper);
    border:1px solid var(--paper-line);
    box-shadow:var(--card-shadow);
    padding:52px 48px 44px;
    transform:rotate(-0.35deg);
  }

  .sheet::before{
    content:"";
    position:absolute;
    left:-1px; top:60px; bottom:60px;
    width:1px;
    border-left:1px dashed var(--paper-line);
  }

  .punch{
    position:absolute;
    left:-6px;
    width:12px; height:12px;
    border-radius:50%;
    background:#fff;
    box-shadow:inset 0 0 0 1px var(--paper-line), 0 1px 2px rgba(0,0,0,0.15);
  }
  .punch.p1{ top:96px; }
  .punch.p2{ top:50%; margin-top:-6px; }
  .punch.p3{ bottom:96px; }

  .breadcrumb{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:24px;
  }

  .breadcrumb a{
    color:var(--pencil);
    text-decoration:none;
    border-bottom:1px solid var(--paper-line);
    padding-bottom:2px;
    transition:color .15s ease, border-color .15s ease;
  }

  .breadcrumb a:hover{
    color:var(--pen-blue);
    border-color:var(--pen-blue);
  }

  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:2px solid var(--ink);
    padding-bottom:20px;
    margin-bottom:32px;
  }

  .header h1{
    font-family:'Lora', serif;
    font-weight:600;
    font-size:28px;
    line-height:1.25;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }

  .header p{
    margin:0;
    font-size:13.5px;
    color:var(--pencil);
    max-width:34ch;
    line-height:1.5;
  }

  .exam-code{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--pencil);
    text-align:right;
    white-space:nowrap;
    padding-top:2px;
  }

  .exam-code .no{
    display:block;
    font-size:15px;
    color:var(--ink);
    font-weight:600;
    margin-top:4px;
  }

  fieldset{
    border:0;
    margin:0 0 30px;
    padding:0;
  }

  legend{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--pen-red);
    text-transform:uppercase;
    margin-bottom:16px;
    padding:0;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:26px 24px;
  }

  .grid.scores{
    grid-template-columns:1fr 1fr;
    margin-top:4px;
  }

  .field{
    position:relative;
    display:flex;
    flex-direction:column;
  }

  .field label{
    font-size:11px;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:var(--pencil);
    margin-bottom:8px;
  }

  .field select,
  .field input{
    appearance:none;
    -webkit-appearance:none;
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--ink);
    padding:6px 22px 8px 2px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--ink);
    border-radius:0;
    transition:border-color .15s ease, transform .15s ease;
  }

  .field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M0 0L5 7L10 0' fill='none' stroke='%238A8072' stroke-width='1.4'/></svg>");
    background-repeat:no-repeat;
    background-position:right 2px center;
    cursor:pointer;
  }

  .field select:invalid{ color:var(--pencil); }

  .field input::placeholder{ color:#B7AF9E; }

  .field select:focus,
  .field input:focus{
    outline:none;
    border-bottom-color:var(--pen-blue);
  }

  .field .unit{
    position:absolute;
    right:2px;
    bottom:9px;
    font-size:12px;
    color:var(--pencil);
    font-family:'IBM Plex Mono', monospace;
    pointer-events:none;
  }

  .submit-row{
    display:flex;
    justify-content:center;
    margin-top:38px;
  }

  .stamp{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--pen-red);
    background:transparent;
    border:2px solid var(--pen-red);
    padding:13px 30px;
    border-radius:999px;
    cursor:pointer;
    transform:rotate(-2deg);
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }

  .stamp:hover{
    background:var(--pen-red);
    color:var(--paper);
    transform:rotate(0deg) scale(1.02);
  }

  .stamp:active{ transform:rotate(0deg) scale(0.97); }

  .result{
    margin-top:44px;
    padding-top:30px;
    border-top:2px solid var(--ink);
    display:flex;
    align-items:center;
    gap:28px;
  }

  .result-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--pencil);
    max-width:15ch;
    line-height:1.5;
  }

  .grade-wrap{
    position:relative;
    width:118px;
    height:118px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .grade-wrap svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  .grade-wrap svg path{
    fill:none;
    stroke:var(--pen-red);
    stroke-width:3;
    stroke-linecap:round;
    stroke-dasharray:340;
    stroke-dashoffset:340;
    animation:draw-circle 0.9s 0.35s cubic-bezier(.5,0,.2,1) forwards;
  }

  @keyframes draw-circle{
    to{ stroke-dashoffset:0; }
  }

  .grade-number{
    font-family:'Lora', serif;
    font-style:italic;
    font-weight:600;
    font-size:34px;
    color:var(--pen-red);
  }

  .footnote{
    margin-top:36px;
    font-size:11px;
    color:var(--pencil);
    text-align:center;
    font-style:italic;
  }

  @media (max-width:600px){
    .sheet{ padding:40px 26px 36px; transform:none; }
    .grid, .grid.scores{ grid-template-columns:1fr; }
    .header{ flex-direction:column; gap:16px; }
    .exam-code{ text-align:left; }
  }

  @media (prefers-reduced-motion: reduce){
    .grade-wrap svg path{ animation:none; stroke-dashoffset:0; }
    .stamp{ transition:none; }
  }
</style>
</head>
<body>

  <main class="sheet">
    <span class="punch p1"></span>
    <span class="punch p2"></span>
    <span class="punch p3"></span>

    <div class="breadcrumb">
      <a href="{{ url_for('index') }}">&larr; Back to home</a>
    </div>

    <div class="header">
      <div>
        <h1>Exam Performance<br>Predictor</h1>
        <p>Fill in the blanks below. A trained model grades the paper and predicts your math score.</p>
      </div>
      <div class="exam-code">
        FORM<span class="no">No. 07</span>
      </div>
    </div>

    <form action="{{ url_for('predict_datapoint') }}" method="post">

      <fieldset>
        <legend>Student profile</legend>
        <div class="grid">
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option value="" selected disabled>Select</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div class="field">
            <label for="ethnicity">Race / ethnicity</label>
            <select id="ethnicity" name="ethnicity" required>
              <option value="" selected disabled>Select</option>
              <option value="group A">Group A</option>
              <option value="group B">Group B</option>
              <option value="group C">Group C</option>
              <option value="group D">Group D</option>
              <option value="group E">Group E</option>
            </select>
          </div>

          <div class="field">
            <label for="parental_level_of_education">Parental education</label>
            <select id="parental_level_of_education" name="parental_level_of_education" required>
              <option value="" selected disabled>Select</option>
              <option value="associate's degree">Associate's degree</option>
              <option value="bachelor's degree">Bachelor's degree</option>
              <option value="high school">High school</option>
              <option value="master's degree">Master's degree</option>
              <option value="some college">Some college</option>
              <option value="some high school">Some high school</option>
            </select>
          </div>

          <div class="field">
            <label for="lunch">Lunch type</label>
            <select id="lunch" name="lunch" required>
              <option value="" selected disabled>Select</option>
              <option value="free/reduced">Free / reduced</option>
              <option value="standard">Standard</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Test preparation</legend>
        <div class="grid">
          <div class="field">
            <label for="test_preparation_course">Prep course</label>
            <select id="test_preparation_course" name="test_preparation_course" required>
              <option value="" selected disabled>Select</option>
              <option value="none">None</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Scores on record</legend>
        <div class="grid scores">
          <div class="field">
            <label for="reading_score">Reading score</label>
            <input id="reading_score" type="number" name="reading_score" min="0" max="100" placeholder="0–100" required />
            <span class="unit">/ 100</span>
          </div>

          <div class="field">
            <label for="writing_score">Writing score</label>
            <input id="writing_score" type="number" name="writing_score" min="0" max="100" placeholder="0–100" required />
            <span class="unit">/ 100</span>
          </div>
        </div>
      </fieldset>

      <div class="submit-row">
        <button class="stamp" type="submit">Grade my exam</button>
      </div>
    </form>

    {% if results %}
    <div class="result">
      <div class="result-label">Predicted math score</div>
      <div class="grade-wrap">
        <svg viewBox="0 0 118 118">
          <path d="M 59 8
                   C 92 6, 112 28, 110 60
                   C 108 94, 84 112, 58 110
                   C 30 108, 8 90, 9 58
                   C 10 27, 30 9, 59 8 Z" />
        </svg>
        <span class="grade-number">{{ results }}</span>
      </div>
    </div>
    {% endif %}

</body>
</html>
